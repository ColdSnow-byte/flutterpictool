[package]
name = "pictool_core"
version = "1.0.0"
edition = "2021"
description = "图片处理工具核心能力：素材替换 / 应用图标替换 / 图片格式转换"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
